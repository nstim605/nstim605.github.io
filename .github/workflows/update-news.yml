name: Prepare financial news moderation

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-financial-news-moderation
  cancel-in-progress: false

env:
  MODERATION_BRANCH: automation/news-moderation

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Continue the persistent moderation branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "${MODERATION_BRANCH}" >/dev/null; then
            git fetch origin "+refs/heads/${MODERATION_BRANCH}:refs/remotes/origin/${MODERATION_BRANCH}"
            git checkout -B "${MODERATION_BRANCH}" "origin/${MODERATION_BRANCH}"
            git merge --no-edit origin/main
          else
            status=$?
            if [ "${status}" -ne 2 ]; then
              exit "${status}"
            fi
            git checkout -b "${MODERATION_BRANCH}" origin/main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and normalize official feeds
        run: node tools/news/fetch-news.mjs

      - name: Prepare non-public moderation drafts
        id: moderation
        run: node tools/news/prepare-moderation.mjs

      - name: Generate only approved public stories
        run: node tools/news/generate-news.mjs

      - name: Run repository-contained site tests
        shell: bash
        run: |
          # This cross-repository suite needs the sibling Android checkout, which is not part of the Pages repository.
          mapfile -d '' site_tests < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'privacy-policy-phase1d.test.mjs' -print0)
          node --test "${site_tests[@]}"
          node --test --test-name-pattern='^(Phase 1D copy covers exactly all 44 production locales|Phase 1D policy copy avoids prohibited English claims|integrity supersession rejects unexplained or future file mutations)$' tests/privacy-policy-phase1d.test.mjs

      - name: Commit persistent state and moderation materials
        id: commit
        shell: bash
        run: |
          git add news/data news/index.html news/news.css news/news.js news-sitemap.xml sitemap.xml sr/news ru/news
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git commit -m "chore(news): prepare moderation candidates"
          git push origin "HEAD:${MODERATION_BRANCH}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Create or update the moderation pull request
        if: steps.moderation.outputs.open_drafts != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view "${MODERATION_BRANCH}" --json number >/dev/null 2>&1; then
            gh pr edit "${MODERATION_BRANCH}" --title "Financial News moderation" --body-file news/data/moderation-report.md
          else
            gh pr create --base main --head "${MODERATION_BRANCH}" --title "Financial News moderation" --body-file news/data/moderation-report.md
          fi
