name: Update financial news

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-financial-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch official source feeds
        run: node tools/news/fetch-news.mjs

      - name: Generate approved news pages and sitemaps
        run: node tools/news/generate-news.mjs

      - name: Run site tests
        run: node --test tests/*.test.mjs

      - name: Commit changed news data
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No news changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news ru/news sr/news news-sitemap.xml sitemap.xml index.html ru/index.html sr/index.html
          git commit -m "chore(news): refresh official feed candidates"
          git pull --rebase origin main
          git push origin HEAD:main
